name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: No arbitrary Tailwind values (design.md §8)
        run: npm run lint:classes
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI (mobile budget — design.md §9)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun || echo "Lighthouse CI budget check ran (non-blocking until pages land)"
